<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cranebonistan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Special+Elite&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Condensed:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">

</head>
<body>
<div id="app">
  <header class="topbar" id="topbar">
    <div class="tb-party" id="tb-party"></div>
    <div class="tb-stats" id="status"></div>
    <nav class="tb-menu" id="tabs" aria-label="Planning files">
      <button data-tab="electorate" title="Electorate" aria-label="Electorate"><span class="tb-ico" data-icon="users"></span><span>Electorate</span></button>
      <button data-tab="platform" title="Platform" aria-label="Platform"><span class="tb-ico" data-icon="scroll-text"></span><span>Platform</span></button>
      <button data-tab="actions" title="Actions" aria-label="Actions"><span class="tb-ico" data-icon="megaphone"></span><span>Actions</span><span class="tb-badge" id="badge-actions" hidden></span></button>
      <button data-tab="parties" title="Country" aria-label="Country"><span class="tb-ico" data-icon="landmark"></span><span>Country</span></button>
      <button data-tab="polls" title="Polls" aria-label="Polls"><span class="tb-ico" data-icon="chart-line"></span><span>Polls</span></button>
      <button data-tab="diary" title="Diary" aria-label="Diary"><span class="tb-ico" data-icon="book-open"></span><span>Diary</span></button>
    </nav>
    <div class="tb-time">
      <div class="tb-date"><span id="tb-date"></span><span id="tb-countdown"></span></div>
      <div class="tb-speed">
        <button id="btn-help" class="tb-btn" aria-label="How to play"><span class="tb-ico" data-icon="circle-help"></span></button>
        <button id="btn-sound" class="tb-btn" aria-label="Sound"></button>
        <button id="btn-week" class="tb-btn" aria-label="Next week" title="Next week"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l12 8-12 8z" fill="currentColor"/></svg></button>
        <button id="btn-skip" class="tb-btn tb-go" aria-label="Skip to next decision" title="Skip to next decision"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4l9 8-9 8zM12 4l9 8-9 8z" fill="currentColor"/></svg><span>Next decision</span></button>
      </div>
    </div>
  </header>

  <main class="hq">
    <section class="board" id="board" aria-label="The board: what needs you now">
      <svg class="strings" id="strings" aria-hidden="true"></svg>
      <div class="board-items" id="board-items"></div>
    </section>

    <section class="map-panel" aria-label="Map of Cranebonistan">
      <svg id="map" viewBox="0 0 2296 1623" role="img" aria-label="Map of Cranebonistan and its neighbours"></svg>
      <div id="map-tip" class="map-tip" hidden></div>
      <div id="map-legend" class="map-legend"></div>
      <div class="ticker" aria-label="Latest news"><span class="ticker-tag">CBC News</span><div class="ticker-run"><div class="ticker-text" id="ticker"></div></div></div>
    </section>

    <aside class="drawer" id="drawer" hidden aria-label="Planning file">
      <div class="drawer-tab" id="drawer-title"></div>
      <button class="drawer-close" id="drawer-close" aria-label="Close the file">×</button>
      <div id="tab-body" class="tab-body"></div>
    </aside>
  </main>
</div>

<div id="title" class="title" hidden></div>
<div id="scene" class="scene" hidden></div>
<div id="modal" class="modal" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="icons.js"></script>
<script src="sfx.js"></script>
<script src="flags.js"></script>
<script src="portraits.js"></script>
<script src="art.js"></script>
<script src="images.js"></script>
<script src="data.js"></script>
<script src="events.js"></script>
<script src="soundbites.js"></script>
<script src="initiatives.js"></script>
<script src="crises.js"></script>
<script src="sim.js"></script>
<script src="world.js"></script>
<script src="voice.js"></script>
<script src="scene.js"></script>
<script src="board.js"></script>
<script src="ui.js"></script>
</body>
</html>
